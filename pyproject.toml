[tool.poetry]
name = "ai-course-agh"
version = "0.1.0"
description = "Exercises for AI course at AGH."
authors = ["Aleksander Smywinski-Pohl <apohllo@o2.pl>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
imbalanced-learn = "^0.12.4"
jupyterlab = "^4.2.5"
jupyterlab-execute-time = "^3.2.0"
jupytext = "^1.16.4"
lightgbm = "^4.5.0"
matplotlib = "^3.9.2"
missingno = "^0.5.2"
pandas = "^2.2.3"
scikit-learn = "^1.5.2"
torch = "^2.5.1"
torchvision = "^0.20.1"
opencv-python = "^4.10.0.84"
numba = "^0.60.0"
numpy = "<2"
scikit-surprise = "^1.1.4"
transformers = {version = ">=4.37.0", extras = ["torch"]}
datasets = "^3.2.0"
sacremoses = "^0.1.1"
accelerate = ">=0.26.0"
evaluate = "^0.4.3"
protobuf = "^5.29.3"
tiktoken = "^0.8.0"
peft = "^0.14.0"
blobfile = "^3.0.0"
tokenizers = "^0.21.0"
sentencepiece = "^0.2.0"
ipywidgets = "^8.1.5"
tensorboard = "^2.18.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"